name: CI

# Every job runs on Windows because the whole repository does: Win32 FFI, GDI
# screen capture, and a release build that embeds a Windows icon. There is no
# Linux job missing here — there is no Linux build.

on:
  push:
    branches: [main]
  pull_request:

# A second push makes the run in flight pointless, and Windows runners are the
# slow kind to leave sitting in a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned, for the same reason slint is pinned in Cargo.toml:
      # `stable` moves, and a clippy that gains a lint overnight turns a green
      # main red without a line of code changing — which is exactly what the
      # first run of this workflow did. Bump it deliberately, as its own
      # commit, so new lints arrive somewhere you can read them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Save even when the job fails. rust-cache saves on success only by
          # default, so a run that times out leaves nothing behind and the next
          # one starts just as cold -- which is how this job stayed red: it
          # never got far enough to write the cache that would let it finish.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --check

      # -D warnings, because a warning nothing fails on is a warning nobody
      # reads. The repository was brought to zero before this gate went in, so
      # anything it reports from here is new.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Covers the screen matcher against its reference implementation, the
      # settings merge rules, device fallback, and that every embedded Defender
      # template still decodes at the size it has always had.
      - name: Tests
        run: cargo test

  release:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same pin as the job above — the shipped binary should not be built by
      # whichever compiler happened to be stable that morning.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          # The release profile shares no artifacts with the debug one the job
          # above caches, so it gets its own entry instead of thrashing that.
          key: release
          cache-on-failure: true

      # Kept out of the Rust job so a full optimised link does not hold up the
      # quick gates. Worth running at all because a wrong include_bytes! path,
      # a missing asset or a broken ui/app.slint are only resolved by a real
      # build.
      - name: Build
        run: cargo build --release
